<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lost in Translation · Exp 002: Convolution — From Mathematical Abstraction to Visual Intuition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1B171E;
      color: #FBF7EC;
      font-family: 'Georgia', serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage-wrap {
      position: relative;
      width: 1920px;
      height: 1080px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
    }
    canvas#stage {
      width: 1920px;
      height: 1080px;
      display: block;
      background: #FBF7EC;
    }
    body.render-mode #controls {
      display: none !important;
    }
    #controls {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(27, 23, 30, 0.92);
      border: 1px solid rgba(251, 247, 236, 0.28);
      border-radius: 10px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 100;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    #controls button {
      background: #E06D32;
      color: #FFFDF8;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #controls input[type="range"] {
      width: 460px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </div>

  <div id="controls">
    <button id="btn-play">PLAY</button>
    <input id="scrubber" type="range" min="0" max="173.24" step="0.0333" value="0" />
    <span id="time-readout">0.00s / 173.24s</span>
  </div>

  <script src="src/timeline_data.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/scenes/act1.js"></script>
  <script src="src/scenes/act2.js"></script>
  <script src="src/scenes/act3_4.js"></script>
  <script src="src/scenes/act5.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.has("render")) {
        document.body.classList.add("render-mode");
      }

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: false });
      const DATA = window.TIMELINE_DATA;
      const DUR = DATA.duration;

      function drawTransitionFlush(ctx, t) {
        const boundaries = [46.8, 98.5, 123.5, 147.5];
        for (let i = 0; i < boundaries.length; i++) {
          const b = boundaries[i];
          const dt = Math.abs(t - b);
          if (dt < 0.34) {
            const u = (t - (b - 0.34)) / 0.68;
            window.ENG.drawBrushWipe(ctx, u);
          }
        }
      }

      function seek(t, collectProbes = false) {
        t = Math.max(0, Math.min(DUR, Number(t) || 0));
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        window.ENG.beginFrameProbes(collectProbes);

        // 1. Static Tactile Studio Desk & Watercolor Sketchbook Backdrop
        const bg = window.ENG.getStaticBackdrop();
        ctx.drawImage(bg, 0, 0);

        // 2. Render Active Scene Acts
        if (t <= 47.2) {
          window.ACT1.renderAct1(ctx, t);
        }
        if (t >= 46.4 && t <= 98.9) {
          window.ACT2.renderAct2(ctx, t);
        }
        if (t >= 98.1 && t <= 147.9) {
          window.ACT3_4.renderAct3_4(ctx, t);
        }
        if (t >= 147.1) {
          window.ACT5.renderAct5(ctx, t);
        }

        // 3. Act Transition Brush Wipe
        drawTransitionFlush(ctx, t);

        // 4. Top Chapter HUD & Progress Bar
        window.ENG.drawTopHUD(ctx, t, DUR);

        // 5. Synchronized Subtitles with Active Word Highlighter
        window.ENG.drawSubtitles(ctx, t, DATA.subtitles);

        // 6. Gentle Fade-in from Warm Paper (0..0.6s) and Fade-out at Tail
        if (t < 0.6) {
          ctx.fillStyle = `rgba(245, 237, 224, ${1 - t / 0.6})`;
          ctx.fillRect(0, 0, 1920, 1080);
        } else if (t > DUR - 0.6) {
          ctx.fillStyle = `rgba(245, 237, 224, ${(t - (DUR - 0.6)) / 0.6})`;
          ctx.fillRect(0, 0, 1920, 1080);
        }
        ctx.restore();
      }

      window.renderAt = function (t, mime = "image/jpeg", quality = 0.94) {
        seek(t, false);
        return canvas.toDataURL(mime, quality);
      };

      window.probeAt = function (t) {
        seek(t, true);
        return window.ENG.analyzeFrameProbes();
      };

      // Low-res grayscale thumbnail + hole check for automatic motion/flash review (inspired by illodev/drawn-by-code review.mjs)
      const thumbCanvas = document.createElement("canvas");
      thumbCanvas.width = 64;
      thumbCanvas.height = 36;
      const thumbCtx = thumbCanvas.getContext("2d");

      window.thumbAt = function (t) {
        seek(t, false);
        thumbCtx.drawImage(canvas, 0, 0, 1920, 1080, 0, 0, 64, 36);
        const img = thumbCtx.getImageData(0, 0, 64, 36).data;
        const lum = [];
        for (let i = 0; i < img.length; i += 4) {
          lum.push(0.299 * img[i] + 0.587 * img[i + 1] + 0.114 * img[i + 2]);
        }
        return lum;
      };

      window.renderSheet = function (times, cols = 4, thumbW = 480) {
        const thumbH = Math.round(thumbW * (1080 / 1920));
        const rows = Math.ceil(times.length / cols);
        const sheet = document.createElement("canvas");
        sheet.width = cols * thumbW;
        sheet.height = rows * thumbH;
        const sctx = sheet.getContext("2d");
        sctx.fillStyle = "#1B171E";
        sctx.fillRect(0, 0, sheet.width, sheet.height);

        for (let i = 0; i < times.length; i++) {
          const t = times[i];
          seek(t, false);
          const c = i % cols;
          const r = Math.floor(i / cols);
          const dx = c * thumbW;
          const dy = r * thumbH;
          sctx.drawImage(canvas, 0, 0, 1920, 1080, dx, dy, thumbW, thumbH);

          sctx.fillStyle = "rgba(27, 23, 30, 0.82)";
          sctx.fillRect(dx + 8, dy + 8, 98, 26);
          sctx.font = "bold 14px monospace";
          sctx.fillStyle = "#E8AD38";
          sctx.fillText(`t=${t.toFixed(1)}s`, dx + 14, dy + 26);
          sctx.strokeStyle = "rgba(35, 29, 40, 0.35)";
          sctx.strokeRect(dx + 0.5, dy + 0.5, thumbW - 1, thumbH - 1);
        }
        return sheet.toDataURL("image/jpeg", 0.92);
      };

      window.__lit = {
        duration: DUR,
        fps: DATA.fps,
        ready: true,
        seek,
        renderAt: window.renderAt,
        probeAt: window.probeAt,
        thumbAt: window.thumbAt,
        renderSheet: window.renderSheet
      };
      window.ready = true;

      const initialT = params.has("t") ? parseFloat(params.get("t")) : 0;
      seek(initialT, false);

      const scrubber = document.getElementById("scrubber");
      const readout = document.getElementById("time-readout");
      const btnPlay = document.getElementById("btn-play");
      scrubber.max = String(DUR);
      scrubber.value = String(initialT);
      readout.textContent = `${initialT.toFixed(2)}s / ${DUR.toFixed(2)}s`;

      let playing = false;
      let playStartWall = 0;
      let playStartT = initialT;

      scrubber.addEventListener("input", () => {
        const val = parseFloat(scrubber.value);
        seek(val, false);
        readout.textContent = `${val.toFixed(2)}s / ${DUR.toFixed(2)}s`;
      });

      btnPlay.addEventListener("click", () => {
        playing = !playing;
        btnPlay.textContent = playing ? "PAUSE" : "PLAY";
        if (playing) {
          playStartWall = performance.now();
          playStartT = parseFloat(scrubber.value);
          requestAnimationFrame(loop);
        }
      });

      function loop(now) {
        if (!playing) return;
        const cur = playStartT + (now - playStartWall) / 1000;
        if (cur >= DUR) {
          seek(DUR, false);
          playing = false;
          btnPlay.textContent = "PLAY";
          return;
        }
        scrubber.value = String(cur);
        readout.textContent = `${cur.toFixed(2)}s / ${DUR.toFixed(2)}s`;
        seek(cur, false);
        requestAnimationFrame(loop);
      }
    })();
  </script>
</body>
</html>
